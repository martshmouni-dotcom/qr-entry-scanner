<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR Entry Scanner</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }

    h1 {
      margin-bottom: 10px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
    }

    #result {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
    }

    .valid {
      background: #d4edda !important;
      color: #155724;
    }

    .used {
      background: #f8d7da !important;
      color: #721c24;
    }

    .invalid {
      background: #fff3cd !important;
      color: #856404;
    }

    .error {
      background: #f8d7da !important;
      color: #721c24;
    }

    .name {
      font-size: 24px;
      margin-top: 10px;
    }

    .qr {
      font-size: 16px;
      margin-top: 8px;
      font-weight: normal;
    }
  </style>
</head>

<body>

  <h1>QR Entry Scanner</h1>

  <div id="reader"></div>

  <div id="result">
    Waiting for QR code...
  </div>


<script>

const BACKEND_URL =
  "https://script.google.com/macros/s/AKfycbwz1tZha63DSsln38Z1MFSOv01qsJV3fB4X-jF6MB2lwJXcSAJVjMVW82qfZbXeY9ZqBQ/exec";

const SCANNER_NAME = "Gate1";

let processing = false;


function showResult(type, title, name, qrId) {

  const result = document.getElementById("result");

  result.className = type;

  result.innerHTML = `
    <div>${title}</div>

    ${
      name
        ? `<div class="name">${name}</div>`
        : ""
    }

    ${
      qrId
        ? `<div class="qr">QR: ${qrId}</div>`
        : ""
    }
  `;
}


async function checkQR(qrId) {

  if (processing) return;

  processing = true;

  showResult(
    "",
    "Checking...",
    "",
    qrId
  );


  try {

    const url =
      BACKEND_URL +
      "?action=scan" +
      "&qrId=" +
      encodeURIComponent(qrId) +
      "&scannerName=" +
      encodeURIComponent(SCANNER_NAME);


    const response =
      await fetch(url);


    const data =
      await response.json();


    if (data.status === "VALID") {

      showResult(
        "valid",
        "✓ ENTRY ALLOWED",
        data.name,
        data.qrId
      );

    }

    else if (data.status === "USED") {

      showResult(
        "used",
        "✗ ALREADY USED",
        data.name,
        data.qrId
      );

    }

    else if (data.status === "INVALID") {

      showResult(
        "invalid",
        "✗ INVALID QR CODE",
        data.name || "",
        data.qrId || qrId
      );

    }

    else {

      showResult(
        "error",
        "ERROR",
        data.message || "",
        qrId
      );

    }

  }

  catch (error) {

    showResult(
      "error",
      "CONNECTION ERROR",
      error.message,
      qrId
    );

  }


  // Wait before allowing another scan
  setTimeout(() => {

    processing = false;

  }, 3000);

}


function onScanSuccess(decodedText) {

  checkQR(decodedText);

}


function onScanFailure(error) {

  // Ignore normal scanning failures.

}


const scanner =
  new Html5QrcodeScanner(
    "reader",
    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      rememberLastUsedCamera: true

    },
    false
  );


scanner.render(
  onScanSuccess,
  onScanFailure
);

</script>

</body>
</html>
